[project]
name = "fleetsentinel"
version = "0.1.0"
description = "FleetSentinel - connected vehicle intelligence platform (workspace root)"
requires-python = ">=3.12"
dependencies = []

[tool.uv.workspace]
members = ["libs/fscore", "services/*", "simulator", "ml"]

[tool.uv.sources]
fscore = { workspace = true }

[dependency-groups]
dev = [
  "pytest>=8.3",
  "pytest-cov>=5.0",
  "pytest-asyncio>=0.24",
  "hypothesis>=6.112",
  "ruff>=0.7",
  "mypy>=1.12",
  "grpcio-tools>=1.66",
  "openapi-spec-validator>=0.7",
  "pglast>=7.0",
  "pyyaml>=6.0",
]

[tool.ruff]
line-length = 110
target-version = "py312"
extend-exclude = ["libs/fscore/src/fleetsentinel"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S"]
ignore = ["S101", "E501"]

[tool.ruff.lint.per-file-ignores]
"**/tests/**" = ["S", "B"]
"tools/**" = ["S603", "S607"]   # dev tooling shells out with fixed, non-user-controlled arguments
# SQL adapters: every query is a static template with bound :params; the only
# interpolated fragments are constant column lists or equality-derived keywords
# (ASC/DESC, >/ <, whitelisted status literals) — never request input.
"services/api/src/fs_api/adapters/pg_sql.py" = ["S608"]
"services/api/src/fs_api/adapters/duckdb_reports.py" = ["S608"]
# TOKEN_BUCKET_LUA is a Lua rate-limit script, not a credential.
"services/api/src/fs_api/adapters/redis_store.py" = ["S105"]

[tool.pytest.ini_options]
addopts = "-ra --strict-markers"
markers = [
  "integration: needs docker services (Testcontainers)",
  "slow: long-running",
]

[tool.coverage.run]
branch = true
source = ["libs/fscore/src/fscore", "services", "simulator", "ml"]
# Unit coverage gate applies to core/domain/application logic. I/O adapters and process entrypoints are covered by
# integration tests (Testcontainers) instead and are excluded here by convention: put them under adapters/ or main.py.
omit = ["*/gen/*", "libs/fscore/src/fleetsentinel/*", "*/adapters/*", "*/main.py", "*/__main__.py", "*/tests/*", "web/*"]

[tool.coverage.report]
fail_under = 80
show_missing = true
