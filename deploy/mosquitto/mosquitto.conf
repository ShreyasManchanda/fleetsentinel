# mTLS-only MQTT edge. Each OEM cloud connector authenticates with a client certificate; the certificate CN becomes the
# username (use_identity_as_username), and the ACL restricts it to its own topic prefix. There is no anonymous listener.
listener 8883
protocol mqtt
cafile /mosquitto/certs/ca.crt
certfile /mosquitto/certs/server.crt
keyfile /mosquitto/certs/server.key
tls_version tlsv1.3
require_certificate true
use_identity_as_username true

allow_anonymous false
acl_file /mosquitto/config/acl

# QoS1 durability + explicit limits (a batch is up to 1 MB; ~1k msg/s steady, ~3k msg/s at 3x burst)
persistence true
persistence_location /mosquitto/data/
max_packet_size 1048576
message_size_limit 1048576
max_inflight_messages 2000
max_queued_messages 200000
max_queued_bytes 0
autosave_interval 60
log_dest stdout
log_type error
log_type warning
