{{- range $name, $svc := .Values.services }}
{{- if and (not $svc.cronjob) (gt ($svc.replicas | int) 1) }}
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ $name }}
spec:
  minAvailable: 1
  selector: { matchLabels: { app.kubernetes.io/name: {{ $name }} } }
{{- end }}
{{- end }}
