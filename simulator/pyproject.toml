[project]
name = "fs-simulator"
version = "0.1.0"
description = "Fleet simulator: OEM connectors, OSM routes, faults, ground-truth oracle, seed generation"
requires-python = ">=3.12"
dependencies = [
  "fscore",
  "structlog>=24.4",
  "prometheus-client>=0.21",
  "orjson>=3.10",
  "pydantic>=2.9",
  "pydantic-settings>=2.6",
  "opentelemetry-api>=1.27",
  "opentelemetry-sdk>=1.27",
  "opentelemetry-exporter-otlp-proto-grpc>=1.27",
  "aiomqtt>=2.3",
  "pyarrow>=17.0",
  "cryptography>=43.0",
  "faker>=30.0",
  "boto3>=1.35",
  "psycopg[binary,pool]>=3.2",
  "hvac>=2.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fs_simulator"]

[tool.uv.sources]
fscore = { workspace = true }
