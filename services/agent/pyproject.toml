[project]
name = "fs-agent"
version = "0.1.0"
description = "Sentinel Copilot: LangGraph agent, allowlisted tools, guardrails, evals"
requires-python = ">=3.12"
dependencies = [
  "fscore",
  "structlog>=24.4",
  "prometheus-client>=0.21",
  "orjson>=3.10",
  "pydantic>=2.9",
  "pydantic-settings>=2.6",
  "opentelemetry-api>=1.27",
  "opentelemetry-sdk>=1.27",
  "opentelemetry-exporter-otlp-proto-grpc>=1.27",
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
  "langgraph>=0.2",
  "langchain-core>=0.3",
  "langchain-anthropic>=0.3",
  "langchain-openai>=0.2",
  "httpx>=0.27",
  "fastembed>=0.4",
  "psycopg[binary,pool]>=3.2",
  "confluent-kafka>=2.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fs_agent"]

[tool.uv.sources]
fscore = { workspace = true }
