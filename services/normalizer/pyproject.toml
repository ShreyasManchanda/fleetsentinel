[project]
name = "fs-normalizer"
version = "0.1.0"
description = "Raw OEM batch -> canonical Protobuf via declarative mappings; DLQ; drift detection"
requires-python = ">=3.12"
dependencies = [
  "fscore",
  "structlog>=24.4",
  "prometheus-client>=0.21",
  "orjson>=3.10",
  "pydantic>=2.9",
  "pydantic-settings>=2.6",
  "opentelemetry-api>=1.27",
  "opentelemetry-sdk>=1.27",
  "opentelemetry-exporter-otlp-proto-grpc>=1.27",
  "confluent-kafka[protobuf,schemaregistry]>=2.6",
  "redis>=5.2",
  "pymongo>=4.10",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fs_normalizer"]

[tool.uv.sources]
fscore = { workspace = true }
