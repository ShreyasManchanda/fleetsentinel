[project]
name = "fs-batch"
version = "0.1.0"
description = "DuckDB batch jobs: features, reports, late-event recompute, reconciliation"
requires-python = ">=3.12"
dependencies = [
  "fscore",
  "structlog>=24.4",
  "prometheus-client>=0.21",
  "orjson>=3.10",
  "pydantic>=2.9",
  "pydantic-settings>=2.6",
  "opentelemetry-api>=1.27",
  "opentelemetry-sdk>=1.27",
  "opentelemetry-exporter-otlp-proto-grpc>=1.27",
  "duckdb>=1.1",
  "pyarrow>=17.0",
  "boto3>=1.35",
  "psycopg[binary,pool]>=3.2",
  "pandas>=2.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fs_batch"]

[tool.uv.sources]
fscore = { workspace = true }
