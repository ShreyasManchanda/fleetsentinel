[project]
name = "fs-lake-sink"
version = "0.1.0"
description = "Canonical events -> Parquet on S3/MinIO with offset-named objects"
requires-python = ">=3.12"
dependencies = [
  "fscore",
  "structlog>=24.4",
  "prometheus-client>=0.21",
  "orjson>=3.10",
  "pydantic>=2.9",
  "pydantic-settings>=2.6",
  "opentelemetry-api>=1.27",
  "opentelemetry-sdk>=1.27",
  "opentelemetry-exporter-otlp-proto-grpc>=1.27",
  "confluent-kafka[protobuf,schemaregistry]>=2.6",
  "pyarrow>=17.0",
  "boto3>=1.35",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fs_lake_sink"]

[tool.uv.sources]
fscore = { workspace = true }
