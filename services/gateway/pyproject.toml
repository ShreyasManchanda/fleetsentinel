[project]
name = "fs-gateway"
version = "0.1.0"
description = "Thin MQTT->Kafka ingestion gateway"
requires-python = ">=3.12"
dependencies = [
  "fscore",
  "structlog>=24.4",
  "prometheus-client>=0.21",
  "orjson>=3.10",
  "pydantic>=2.9",
  "pydantic-settings>=2.6",
  "opentelemetry-api>=1.27",
  "opentelemetry-sdk>=1.27",
  "opentelemetry-exporter-otlp-proto-grpc>=1.27",
  "aiomqtt>=2.3",
  "confluent-kafka>=2.6",
  "redis>=5.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fs_gateway"]

[tool.uv.sources]
fscore = { workspace = true }
