[project]
name = "fs-api"
version = "0.1.0"
description = "REST + WebSocket API: OIDC, RBAC, RLS, audit, pagination, rate limits"
requires-python = ">=3.12"
dependencies = [
  "fscore",
  "structlog>=24.4",
  "prometheus-client>=0.21",
  "orjson>=3.10",
  "pydantic>=2.9",
  "pydantic-settings>=2.6",
  "opentelemetry-api>=1.27",
  "opentelemetry-sdk>=1.27",
  "opentelemetry-exporter-otlp-proto-grpc>=1.27",
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
  "sqlmodel>=0.0.22",
  "sqlalchemy[asyncio]>=2.0",
  "psycopg[binary,pool]>=3.2",
  "pyjwt[crypto]>=2.9",
  "httpx>=0.27",
  "redis>=5.2",
  "pymongo>=4.10",
  "hvac>=2.3",
  "duckdb>=1.1",
  "confluent-kafka>=2.6",
  "websockets>=13.1",
  "alembic>=1.13",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fs_api"]

[tool.uv.sources]
fscore = { workspace = true }
