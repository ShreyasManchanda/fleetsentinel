name: ci
on:
  push:
  pull_request:
    branches: [main]

concurrency: { group: "ci-${{ github.ref }}", cancel-in-progress: true }

jobs:
  # Every push: fast gates. Coverage gate (>= 80% on core/domain/application code) is enforced by pyproject [tool.coverage.report].
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with: { enable-cache: true }
      - run: uv sync --all-packages
      - run: uv run ruff check .
      - run: uv run python tools/gen_proto.py && git diff --exit-code libs/fscore/src/fleetsentinel   # generated code must be committed & current
      - run: uv run python -c "import yaml; from openapi_spec_validator import validate; validate(yaml.safe_load(open('contracts/openapi.yaml')))"
      - run: uv run pytest -m "not integration and not slow" --cov --cov-report=xml --cov-report=term-missing
      - uses: actions/upload-artifact@v4
        with: { name: coverage, path: coverage.xml }

  schema-compat:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: bufbuild/buf-setup-action@v1
      - uses: bufbuild/buf-lint-action@v1
        with: { input: contracts/proto }
      - uses: bufbuild/buf-breaking-action@v1
        if: github.event_name == 'pull_request'
        with: { input: contracts/proto, against: "https://github.com/${{ github.repository }}.git#branch=main,subdir=contracts/proto" }

  security-fast:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: gitleaks/gitleaks-action@v2
        env: { GITHUB_TOKEN: "${{ secrets.GITHUB_TOKEN }}" }
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --all-packages
      - run: uvx semgrep --config p/python --config p/owasp-top-ten --error --quiet libs services simulator ml tools
      - run: uvx pip-audit --skip-editable || true   # advisory on push; blocking on PR (see pr.yml owned by the DevOps stream)

  docs-fresh:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - run: python tools/docs_check.py --base origin/${{ github.base_ref }}   # living docs must move with the code

  # PR to main: heavier gates (Testcontainers integration, contracts, BDD, compliance, image scan, DAST) live in pr.yml (DevOps stream).
