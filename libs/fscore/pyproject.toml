[project]
name = "fscore"
version = "0.1.0"
description = "FleetSentinel shared core: algorithms, sketches, geo, VIN/DTC, mapping engine, generated event contracts"
requires-python = ">=3.12"
dependencies = [
  "protobuf>=5.28",
  "pyyaml>=6.0",
  "numpy>=2.0",
  "orjson>=3.10",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fscore", "src/fleetsentinel"]
